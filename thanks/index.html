<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list, Muse Foundry</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <a href="/"><img src="/img/mf-wordmark.png" alt="Muse Foundry" class="wordmark"></a>
</header>

<main>
  <section class="hero">
    <div class="hero-copy">
      <div class="done">
        <h2>You're on the list</h2>
        <p id="doneMsg">We will be in touch, thanks for signing up</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>&copy; 2026 Muse Foundry &middot; <a class="footer-contact" href="mailto:jeffrey@musefoundry.studio?subject=Muse%20Foundry">Contact</a></p>
</footer>

<script>
// Show the branch-specific line when the signup page passes ?b=listener|artist.
// Falls back to the generic message for the no-JS server redirect, which has
// no query string.
(function () {
  var b = new URLSearchParams(location.search).get('b');
  var msg = {
    listener: 'We will email you when there is something to buy',
    artist:   'We will be in touch about carrying your releases'
  };
  if (b && msg[b]) document.getElementById('doneMsg').textContent = msg[b];
})();
</script>

<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
